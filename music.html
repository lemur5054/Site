<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thelemur55 - Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Reusable Header Container -->
    <div id="header-container"></div>

    <!-- Main Layout -->
    <div class="main-layout">
        
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-section">
                <h3 class="section-label toggle-btn">MUSIC <span class="arrow">▼</span></h3>
                <ul class="sidebar-list">
                    <li><a href="#remixes" class="active">Remixes</a></li>
                </ul>
            </div>
        </nav>

        <!-- Content Area -->
        <main class="content">
            <section id="remixes">
                <h2 class="page-title">Remixes</h2>
                <hr class="title-divider">
                
                <!-- Horizontal Card -->
                <div class="horizontal-card">
                    <div class="horizontal-card-content">
                        <h3>Vilager newz</h3>
                        <p>A remix of the popular intro to "Vilager newz" from Element Animation.</p>
                        
                        <div class="horizontal-btn-group">
                            <a href="https://youtu.be/tkM51rw4SkM" class="card-btn" target="_blank">Play Song &rarr;</a>
                            <a href="https://github.com/lemur5054/Projects/blob/main/Music/Remix/VilagerNewz" class="card-btn" target="_blank">Remix Download &rarr;</a>
                            <a href="https://www.elementanimation.com/" class="card-btn" target="_blank">Element Animation &rarr;</a>
                        </div>
                    </div>
                    <div class="horizontal-card-image">
                        <img src="database/img/Villager_News_poster.jpg" alt="Vilager newz thumbnail">
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
